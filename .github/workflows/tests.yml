name: Tests
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
              
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: placeholder-for-mocked-tests
          JWT_SECRET_KEY: placeholder-for-deterministic-jwt-tests
          DB_NAME: ${{ runner.temp }}/service-agent-test.db
        run: pytest -v
